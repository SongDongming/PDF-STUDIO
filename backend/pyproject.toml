[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "multimodal-pdf-backend"
version = "0.1.0"
description = "FastAPI backend for the multimodal PDF knowledge base prototype"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "deepagents>=0.7,<0.8",
  "langchain>=1.3,<1.4",
  "langchain-openai>=1.4,<1.5",
  "langgraph>=1.2,<1.3",
  "minio>=7.2,<8",
  "neo4j>=5.27,<7",
  "pillow>=11,<13",
  "psycopg[binary]>=3.2,<4",
  "pymupdf>=1.26,<2",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
  "langgraph-checkpoint-postgres>=3,<4",
  "jsonschema>=4,<5",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
