name: multimodal-pdf-wiki

x-backend-environment: &backend-environment
  APP_ENV: development
  APP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
  APP_MINIO_ENDPOINT: minio:9000
  APP_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
  APP_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
  APP_MINIO_SECURE: "false"
  APP_MINIO_BUCKET: pdfwiki
  APP_NEO4J_URI: bolt://neo4j:7687
  APP_NEO4J_USER: neo4j
  APP_NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
  APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-["http://localhost:4321"]}
  APP_OCR_BASE_URL: ${APP_OCR_BASE_URL:-http://ocr-bridge:18111}
  APP_STORAGE_BACKEND: minio
  APP_COMPILE_MODE: ${APP_COMPILE_MODE:-sync}
  APP_LOCAL_JOB_CONCURRENCY: ${APP_LOCAL_JOB_CONCURRENCY:-2}
  APP_AGENT_RUNTIME: ${APP_AGENT_RUNTIME:-legacy}
  APP_PROVIDER_SECRET_FILE: /tmp/provider-secrets.json
  MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
  MOONSHOT_BASE_URL: ${MOONSHOT_BASE_URL:-https://api.deepseek.com/v1}
  MOONSHOT_CHAT_MODEL: ${MOONSHOT_CHAT_MODEL:-deepseek-v4-flash}
  MOONSHOT_STRUCTURED_MODEL: ${MOONSHOT_STRUCTURED_MODEL:-deepseek-v4-flash}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
  OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-embedding-3}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    # 小内存（2G）服务器：压缩 shared_buffers，留内存给其余容器。
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=100"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      # 小内存（2G）服务器：把 JVM 堆和 page cache 压到可控范围，
      # 否则 Neo4j 默认抢占数 GB 内存触发 OOM。
      NEO4J_server_memory_heap_initial__size: 128m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 128m
      NEO4J_dbms_memory_transaction_total_max: 64m
    volumes:
      - neo4j-data:/data
    ports:
      - "127.0.0.1:17474:7474"
      - "127.0.0.1:17687:7687"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://localhost:7474 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  ocr-bridge:
    build:
      context: ..
      dockerfile: infra/Dockerfile.ocr-bridge
    env_file:
      - ocr.env
    expose:
      - "18111"
    restart: unless-stopped

  api:
    build:
      context: ../backend
    environment: *backend-environment
    ports:
      - "${PDFWIKI_API_PORT:-18800}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      ocr-bridge:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    ports:
      - "${PDFWIKI_WEB_PORT:-4321}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  neo4j-data:
